name: MoodDNA APK Build

on:
  push:
    branches:
      - mooddna-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct MoodDNA project ZIP
        shell: bash
        run: |
          cat .mooddna/chunk*.b64 | tr -d '\r\n' | base64 -d > mooddna.zip
          mkdir -p unpack
          unzip -q mooddna.zip -d unpack
          echo "Project files:"
          find unpack/MoodDNA -maxdepth 3 -type f | sort | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: unpack/MoodDNA
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find unpack/MoodDNA -type f -name "*.apk" -print -exec cp {} artifacts/ \; || true
          ls -lah artifacts || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodDNA-debug-apk
          path: artifacts/*.apk
          if-no-files-found: warn
