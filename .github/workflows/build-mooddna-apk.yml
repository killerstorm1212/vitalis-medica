name: Build MoodDNA APK

on:
  push:
    branches:
      - mooddna-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and harden MoodDNA project
        shell: bash
        run: |
          set -euxo pipefail
          cat             .mooddna_fixed/part01.b64             .mooddna_fixed/part02.b64             .mooddna_fixed/part03.b64             .mooddna_fixed/part04.b64             .mooddna/chunk03.b64             .mooddna/chunk04.b64             .mooddna/chunk05.b64             > /tmp/MoodDNA.zip.b64
          test "$(wc -c < /tmp/MoodDNA.zip.b64)" -eq 68172
          base64 --decode /tmp/MoodDNA.zip.b64 > /tmp/MoodDNA.zip
          unzip -t /tmp/MoodDNA.zip
          rm -rf /tmp/mooddna-src
          mkdir -p /tmp/mooddna-src
          unzip -q /tmp/MoodDNA.zip -d /tmp/mooddna-src

          # Replace invalid launcher vector.
          cat > /tmp/mooddna-src/MoodDNA/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,20 C35.2,20 20,35.2 20,54 C20,72.8 35.2,88 54,88 C72.8,88 88,72.8 88,54 C88,35.2 72.8,20 54,20 Z M54,78 C40.8,78 30,67.2 30,54 C30,40.8 40.8,30 54,30 C67.2,30 78,40.8 78,54 C78,67.2 67.2,78 54,78 Z"/>
              <path
                  android:fillColor="#E3DFFF"
                  android:pathData="M54,42 C47.373,42 42,47.373 42,54 C42,60.627 47.373,66 54,66 C60.627,66 66,60.627 66,54 C66,47.373 60.627,42 54,42 Z"/>
          </vector>
          EOF

          # Memory-safety fix: the original decoder boxed up to ~2 million Float
          # objects per song, which can OOM the app during automatic analysis.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/mooddna-src/MoodDNA/app/src/main/java/com/mooddna/engine/audio/AudioDecoder.kt")
          s = p.read_text()
          s = s.replace(
              "val maxSamples = sampleRate * channelCount * maxDurationSecs\n            val pcmFloats = ArrayList<Float>(maxSamples)",
              "val maxSamples = minOf(sampleRate.toLong() * channelCount.toLong() * maxDurationSecs.toLong(), 1_200_000L).toInt()\n            val pcmFloats = FloatArray(maxSamples)"
          )
          s = s.replace(
              "pcmFloats.add(sample)\n                            samplesCollected++",
              "pcmFloats[samplesCollected] = sample\n                            samplesCollected++"
          )
          s = s.replace(
              "samples = pcmFloats.toFloatArray(),",
              "samples = pcmFloats.copyOf(samplesCollected),"
          )
          p.write_text(s)

          # Analyse a bounded 12-second sample; the decoder also has a hard primitive-array cap.
          p = Path("/tmp/mooddna-src/MoodDNA/app/src/main/java/com/mooddna/engine/pipeline/AudioAnalysisWorker.kt")
          s = p.read_text().replace("maxDurationSecs = 20", "maxDurationSecs = 12")
          s = s.replace("val batchLimit = 20", "val batchLimit = 4")
          p.write_text(s)

          # Make the update distinguishable/install-over-able.
          p = Path("/tmp/mooddna-src/MoodDNA/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("versionCode = 1", "versionCode = 2")
          s = s.replace('versionName = "1.0.0"', 'versionName = "1.0.1-crashfix"')
          p.write_text(s)

          # Sanity check that the critical substitutions happened.
          decoder = Path("/tmp/mooddna-src/MoodDNA/app/src/main/java/com/mooddna/engine/audio/AudioDecoder.kt").read_text()
          assert "FloatArray(maxSamples)" in decoder
          assert "copyOf(samplesCollected)" in decoder
          assert "1_200_000L" in decoder
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/mooddna-src/MoodDNA
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s /tmp/mooddna-src/MoodDNA/app/build/outputs/apk/debug/app-debug.apk
          unzip -t /tmp/mooddna-src/MoodDNA/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/mooddna-src/MoodDNA/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodDNA-1.0.1-crashfix
          path: /tmp/mooddna-src/MoodDNA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
