name: Build MoodDNA APK

on:
  push:
    branches:
      - mooddna-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct MoodDNA source
        shell: bash
        run: |
          set -euxo pipefail
          cat             .mooddna_fixed/part01.b64             .mooddna_fixed/part02.b64             .mooddna_fixed/part03.b64             .mooddna_fixed/part04.b64             .mooddna/chunk03.b64             .mooddna/chunk04.b64             .mooddna/chunk05.b64             > /tmp/MoodDNA.zip.b64
          test "$(wc -c < /tmp/MoodDNA.zip.b64)" -eq 68172
          base64 --decode /tmp/MoodDNA.zip.b64 > /tmp/MoodDNA.zip
          unzip -t /tmp/MoodDNA.zip
          rm -rf /tmp/mooddna-src
          mkdir -p /tmp/mooddna-src
          unzip -q /tmp/MoodDNA.zip -d /tmp/mooddna-src

      - name: Apply 10k-track scalability patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .mooddna_patch/part1.py .mooddna_patch/part2.py > /tmp/mooddna_10k_patch.py
          python3 /tmp/mooddna_10k_patch.py
          grep -R "versionName = \"1.0.2-10k\"" -n /tmp/mooddna-src/MoodDNA/app/build.gradle.kts
          grep -R "getRecentTracksFlow" -n /tmp/mooddna-src/MoodDNA/app/src/main/java/com/mooddna
          grep -R "maxTracksThisRun = 40" -n /tmp/mooddna-src/MoodDNA/app/src/main/java/com/mooddna

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .mooddna_signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/mooddna-src/MoodDNA
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/mooddna-src/MoodDNA/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodDNA-1.0.2-10k
          path: /tmp/mooddna-src/MoodDNA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
